name: PostgreSQL Refund Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  postgres-integration-tests:
    name: Isolated PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_walk_with_us
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Application Dependencies
        run: npm ci

      - name: Install Test Driver (pg)
        run: npm install --no-save pg

      - name: Install PostgreSQL Client Tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap Minimal Supabase Compatibility Objects
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d test_walk_with_us -v ON_ERROR_STOP=1 -f scripts/ci/bootstrap-supabase-compat.sql

      - name: Apply Real Foundation Migration (20261103_donations_foundation.sql)
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d test_walk_with_us -v ON_ERROR_STOP=1 -f supabase/migrations/20261103_donations_foundation.sql

      - name: Apply Real Partial-Refund Proposal (proposal_20261104_partial_refunds.sql)
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d test_walk_with_us -v ON_ERROR_STOP=1 -f supabase/migrations/proposal_20261104_partial_refunds.sql

      - name: Run In-Memory State Machine Tests
        run: node scripts/test-refund-accounting.js

      - name: Run Real Multi-Connection PostgreSQL Integration Tests
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/test_walk_with_us
          CI: "true"
        run: node scripts/test-real-pg-integration.js

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Run Production Build
        run: npm run build
